# Marginal, and kept so it can be measured rather than guessed at. A 33-module symbol at
# 18 mm is 0.55 mm per module, which is where laser toner spread and a phone at arm's
# length start to disagree. Dropping the error-correction level to M takes the symbol to
# 29 modules and the modules back up to 0.62 mm.
#
# No secret printed: the column left over will not hold it, and a code this small is for
# something scanned at close range.
[relief-kopi-48]
description = "Relief kopi, 48.5 x 25.4 mm, 40 up; modules are small, measure first"
cols = 4
rows = 10
margin_left_mm = 8.0
margin_top_mm = 21.5
pitch_x_mm = 48.5
pitch_y_mm = 25.4
label_w_mm = 48.5
label_h_mm = 25.4
inset_x_mm = 1.0
inset_y_mm = 1.0
qr_mm = 18.0
label_lines = 0
cut_guides = false
print_secret = false
deprecated = true

# The same label as t7160, with a 2mm gutter between the columns rather than 2.5mm, and
# the rows back to back. Measured off a sheet with a ruler rather than read off a
# datasheet: 15mm above and below the grid, 7mm left of it and 8mm right of it.
#
# The die-cut sits about a millimetre off centre and a ruler reads to half of one, so the
# side inset is wider than the vertical one: the outer columns keep clear of the label
# edge even where the cut has wandered.
#
# The rows touch, so the white between two rows of codes is both stickers' insets and
# quiet zones and nothing else. Two modules of quiet zone and a 1mm inset take that from
# 11mm to 6mm and give the symbol the height back.
[relief-kopi-63]
description = "Relief kopi, 63.5 x 38.1 mm, 21 up"
cols = 3
rows = 7
margin_left_mm = 7.0
margin_top_mm = 15.15
pitch_x_mm = 65.5
pitch_y_mm = 38.1
label_w_mm = 63.5
label_h_mm = 38.1
inset_x_mm = 2.5
inset_y_mm = 1.0
qr_mm = 32.0
quiet_modules = 2
label_lines = 1
cut_guides = false
print_secret = true
