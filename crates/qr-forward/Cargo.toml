[package]
name = "qr-forward"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The URL-forwarding handler: a QR that redirects, repointable later"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true, features = ["http1", "json", "tokio"] }
chrono = { workspace = true, features = ["clock", "serde", "std"] }
maud = { workspace = true, features = ["axum"] }
qr-core = { workspace = true }
qr-handler = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
sqlx = { workspace = true, features = [
  "chrono",
  "postgres",
  "runtime-tokio",
  "uuid",
] }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "std", "v7"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
