[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://git.shine.town/sshine/qr"
homepage = "https://qr.shine.town"

# Versions live here and the crates inherit them; feature sets stay with the crate that
# needs them, since those are what differ between members.
[workspace.dependencies]
qr-core = { version = "0.1.0", path = "crates/qr-core" }
qr-handler = { version = "0.1.0", path = "crates/qr-handler" }
qr-photos = { version = "0.1.0", path = "crates/qr-photos" }
qr-forward = { version = "0.1.0", path = "crates/qr-forward" }
qr-sheet = { version = "0.1.0", path = "crates/qr-sheet" }

async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false }
axum-extra = { version = "0.12.6", default-features = false }
base64 = { version = "0.23.1", default-features = false }
blake3 = { version = "1.8.7", default-features = false }
bytes = { version = "1.12.1", default-features = false }
chrono = { version = "0.4.45", default-features = false }
clap = { version = "4.6.7", default-features = false }
getrandom = { version = "0.4.3", default-features = false }
humantime = "2.4.0"
image = { version = "0.25.10", default-features = false }
jsonwebtoken = { version = "11.1.0", default-features = false }
kamadak-exif = "0.6.1"
maud = { version = "0.27.0", default-features = false }
mime = "0.3.17"
mime_guess = { version = "2.0.5", default-features = false }
qrcode = { version = "0.14.1", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
rust-embed = { version = "8.13.0", default-features = false }
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.151", default-features = false }
sqlx = { version = "0.9.0", default-features = false }
subtle = { version = "2.6.1", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", default-features = false }
tokio-util = { version = "0.7.19", default-features = false }
toml = { version = "1.1.6", default-features = false }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.1", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
url = { version = "2.5.8", default-features = false }
uuid = { version = "1.27.0", default-features = false }

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
