# Sheet layouts, in millimetres on A4.
#
# The label stock is the Relief laser range Bog & Idé sells; the model codes match the
# Avery sizes those sheets are cut to, so a preset here also fits the equivalent Avery
# stock. `plain` is blank paper with cut guides and needs no stock at all.
#
# Every printer places the page origin a millimetre or two differently. `qr-server sheet
# --calibration` prints crosshairs to measure that against; correct it by overriding
# margin_left_mm and margin_top_mm rather than by editing a preset, so the stock's real
# geometry stays recorded here.
#
# qr_mm is the symbol alone; the renderer adds the four-module quiet zone around it, so a
# sticker must leave qr_mm * (modules + 8) / modules. The caption sits beside the symbol
# in whatever width is left, and its type size is fitted to that column, so the figures
# below were chosen against a 33-module symbol and are checked on every render.

[plain]
description = "Blank A4 with dashed cut guides, 12 up"
cols = 2
rows = 6
margin_left_mm = 8.0
margin_top_mm = 12.0
pitch_x_mm = 97.0
pitch_y_mm = 46.0
label_w_mm = 95.0
label_h_mm = 45.0
inset_x_mm = 2.5
inset_y_mm = 2.5
qr_mm = 30.0
label_lines = 2
cut_guides = true
print_secret = true

