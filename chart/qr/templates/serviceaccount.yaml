{{- if .Values.serviceAccount.create }}
# Off by default, and there is no Role or ClusterRole in this chart. The service reads no
# Kubernetes resources at all; turn this on only if something added alongside needs an
# identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "qr.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qr.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
