{{- if .Values.serviceMonitor.enabled }}
# Scrapes the health port, which is where /metrics lives and which the Service above
# deliberately does not expose. A ServiceMonitor needs a port to name, so this one points
# at a Service of its own rather than widening the public one.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "qr.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qr.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "qr.selectorLabels" . | nindent 4 }}
  ports:
    - name: health
      port: {{ .Values.service.healthPort }}
      targetPort: health
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "qr.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qr.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "qr.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: health
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
