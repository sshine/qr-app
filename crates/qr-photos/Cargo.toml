[package]
name = "qr-photos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The photo-album handler: what is in the box"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true, features = [
  "http1",
  "json",
  "multipart",
  "query",
  "tokio",
] }
bytes = { workspace = true, features = ["std"] }
chrono = { workspace = true, features = ["clock", "serde", "std"] }
# Only the formats a phone camera and a file picker actually produce. default-formats
# would pull in AVIF, EXR, TIFF and the rest, which nothing here can receive.
image = { workspace = true, features = ["jpeg", "png", "rayon", "webp"] }
kamadak-exif = { workspace = true }
maud = { workspace = true, features = ["axum"] }
qr-core = { workspace = true }
qr-handler = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
sqlx = { workspace = true, features = [
  "chrono",
  "postgres",
  "runtime-tokio",
  "uuid",
] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde", "std", "v7"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
