name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# One group shared with the release workflow, so a push to main does not start a CI run
# and an image build on the same runner at the same time. Both are full Nix builds of
# the same closure, and running them together is what killed the first attempt.
concurrency:
  group: qr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    # The in-cluster runner: it has nix already and substitutes from the cluster's own
    # binary cache rather than fetching a toolchain across the internet.
    runs-on: nixos
    steps:
      - uses: actions/checkout@v4

      # Everything, in one cached pass: formatting through treefmt-nix, the git hooks
      # through hk-nix, clippy, the package build and its unit tests, the startup check
      # that runs the binary, and the integration derivation, which starts a Postgres in
      # the sandbox and runs the tests that are #[ignore]d everywhere else.
      #
      # `just ci` is the same ground covered by a devshell, and running both here built
      # the workspace three times over for one answer.
      - name: Flake check
        run: nix flake check -L

      # The chart shell, not the default one: that carries a Rust toolchain and a
      # Postgres, which on an empty store costs minutes before helm is reached.
      - name: Chart
        run: nix develop .#chart --command just chart-lint

      # Feeds the chart's rendered arguments back to the binary. The two are separate
      # artifacts with no compiler between them, so without this a renamed flag ships
      # and is discovered as a CrashLoopBackOff. The binary it uses is the derivation
      # the flake check already built.
      - name: Chart arguments
        run: nix develop --command just chart-args-check
