# Sheet layouts, in millimetres on A4.
#
# Only relief-kopi-63 is offered. Everything else carries deprecated = true: those figures
# came off a manufacturer's datasheet, and the one sheet of stock that has since been put
# under a caliper did not match the datasheet it was named after. They still render by
# name, so a link saved earlier keeps working, and whichever is measured next loses the
# flag.
#
# Every printer places the page origin a millimetre or two differently. `qr-server sheet
# --calibration` prints crosshairs to measure that against; correct it with --offset-x-mm
# and --offset-y-mm rather than by editing a preset, so the stock's real geometry stays
# recorded here and one printer's error does not travel with it.
#
# qr_mm is the symbol alone; the renderer leaves quiet_modules (four unless a preset says
# otherwise) of blank paper on each side of it, so a sticker must leave
# qr_mm * (modules + 2 * quiet_modules) / modules. The caption sits beside the symbol
# in whatever width is left, and its type size is fitted to that column, so the figures
# below were chosen against a 33-module symbol and are checked on every render.

[plain]
description = "Blank A4 with dashed cut guides, 12 up"
cols = 2
rows = 6
margin_left_mm = 8.0
margin_top_mm = 12.0
pitch_x_mm = 97.0
pitch_y_mm = 46.0
label_w_mm = 95.0
label_h_mm = 45.0
inset_x_mm = 2.5
inset_y_mm = 2.5
qr_mm = 30.0
label_lines = 2
cut_guides = true
print_secret = true
