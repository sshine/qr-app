# Marginal, and kept so it can be measured rather than guessed at. A 33-module symbol at
# 18 mm is 0.55 mm per module, which is where laser toner spread and a phone at arm's
# length start to disagree. Dropping the error-correction level to M takes the symbol to
# 29 modules and the modules back up to 0.62 mm.
#
# No secret printed: the column left over will not hold it, and a code this small is for
# something scanned at close range.
[relief-kopi-48]
description = "Relief kopi, 48.5 x 25.4 mm, 40 up; modules are small, measure first"
cols = 4
rows = 10
margin_left_mm = 8.0
margin_top_mm = 21.5
pitch_x_mm = 48.5
pitch_y_mm = 25.4
label_w_mm = 48.5
label_h_mm = 25.4
inset_x_mm = 1.0
inset_y_mm = 1.0
qr_mm = 18.0
label_lines = 0
cut_guides = false
print_secret = false
